<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="blueGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0c1e40" />
    </radialGradient>
  </defs>

  <!-- Outer Cogwheel / Sunburst Gear -->
  <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8">
    <!-- 24 rays / cog teeth -->
    <circle cx="50" cy="50" r="46" />
    <!-- scalloped sunburst points -->
    <path d="
      M 50 2 A 4 4 0 0 1 54 5 L 61 7 A 4 4 0 0 1 64 11 L 71 15 A 4 4 0 0 1 73 20 L 79 26 A 4 4 0 0 1 80 32 L 84 39 A 4 4 0 0 1 84 45 L 86 52 A 4 4 0 0 1 84 58 L 82 65 A 4 4 0 0 1 80 71 L 75 77 A 4 4 0 0 1 71 82 L 64 86 A 4 4 0 0 1 58 89 L 51 90 A 4 4 0 0 1 45 89 L 39 87 A 4 4 0 0 1 33 83 L 27 78 A 4 4 0 0 1 23 72 L 19 66 A 4 4 0 0 1 17 59 L 16 52 A 4 4 0 0 1 17 45 L 19 38 A 4 4 0 0 1 22 32 L 27 26 A 4 4 0 0 1 32 21 L 38 16 A 4 4 0 0 1 44 12 Z
    " />
  </g>

  <!-- Golden Ring -->
  <circle cx="50" cy="50" r="39" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.2" />

  <!-- Inner Navy Blue Shield Circle -->
  <circle cx="50" cy="50" r="33" fill="url(#blueGrad)" stroke="#fef08a" stroke-width="1.5" />

  <!-- Inner Sacred Flame / Wheel Elements -->
  <!-- Concentric Gold Ring -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Ashoka Stambh / Emblem Representation -->
  <g fill="#fef08a" stroke="#d97706" stroke-width="0.3">
    <!-- Pedestal Base -->
    <rect x="42" y="66" width="16" height="3" rx="1" />
    <rect x="44" y="63" width="12" height="3" rx="0.5" />
    <circle cx="50" cy="64.5" r="1.2" fill="#1e3a8a" />

    <!-- Pillar / Lions Body -->
    <path d="M 46 63 L 45 42 L 55 42 L 54 63 Z" />

    <!-- Center Lion Head & Crown -->
    <path d="M 47 42 C 45 38 46 32 50 31 C 54 32 55 38 53 42 Z" />
    <circle cx="50" cy="35" r="3" fill="#fde047" />

    <!-- Left & Right Lion Heads -->
    <path d="M 43 43 C 41 40 42 35 45 34 L 46 41 Z" />
    <path d="M 57 43 C 59 40 58 35 55 34 L 54 41 Z" />

    <!-- Ashoka Chakra in Center -->
    <circle cx="50" cy="52" r="5" fill="#1e3a8a" stroke="#fde047" stroke-width="0.8" />
    <circle cx="50" cy="52" r="1.5" fill="#fde047" />
    <!-- Spokes -->
    <line x1="50" y1="47" x2="50" y2="57" stroke="#fde047" stroke-width="0.5" />
    <line x1="45" y1="52" x2="55" y2="52" stroke="#fde047" stroke-width="0.5" />
    <line x1="46.5" y1="48.5" x2="53.5" y2="55.5" stroke="#fde047" stroke-width="0.5" />
    <line x1="46.5" y1="55.5" x2="53.5" y2="48.5" stroke="#fde047" stroke-width="0.5" />
  </g>

  <!-- Subtle Rim Glow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.6" />
</svg>
